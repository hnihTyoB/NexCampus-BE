name: Deploy Backend to VPS (GHCR)

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE_REPOSITORY: ghcr.io/hnihtyob/nexcampus-backend

jobs:
  build-and-push:
    name: Build & Push BE Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/nexcampus/NexCampus-BE

            deploy_image="${{ env.BACKEND_IMAGE_REPOSITORY }}:${{ github.sha }}"
            rollback_image="${{ env.BACKEND_IMAGE_REPOSITORY }}:rollback-${{ github.run_id }}"
            previous_image_id=""

            rollback_backend() {
              if [ -z "${previous_image_id}" ]; then
                echo "No previous backend image is available for rollback."
                return
              fi

              echo "Rolling back to the previous backend image..."
              BACKEND_IMAGE="${rollback_image}" docker-compose up -d --no-deps --force-recreate backend
              docker-compose ps backend
            }

            echo "Checking required Cloudflare R2 configuration..."
            missing_r2_env=0
            for env_name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL R2_MAX_FILE_SIZE_MB; do
              if ! grep -Eq "^${env_name}=.+" .env; then
                echo "Missing required environment variable: ${env_name}"
                missing_r2_env=1
              fi
            done
            if [ "${missing_r2_env}" -ne 0 ]; then
              echo "Deployment stopped before changing the running backend."
              exit 1
            fi

            echo "Pulling compose file changes..."
            git fetch origin production
            git checkout production
            git pull --ff-only origin production

            echo "Authenticating Docker with GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u hnihtyob --password-stdin

            echo "Pulling backend image ${deploy_image} from GHCR (quiet mode)..."
            docker pull -q "${deploy_image}"

            echo "Updating compose files to use the pulled image..."
            BACKEND_IMAGE="${deploy_image}" docker-compose pull backend

            previous_image_id="$(docker inspect --format '{{.Image}}' nexcampus_be 2>/dev/null || true)"
            if [ -n "${previous_image_id}" ]; then
              docker tag "${previous_image_id}" "${rollback_image}"
            fi

            echo "Stopping and removing old container..."
            docker-compose stop backend || true
            docker-compose rm -f backend || true

            echo "Re-creating backend container..."
            BACKEND_IMAGE="${deploy_image}" docker-compose up -d --no-deps backend

            echo "Waiting for the backend health check..."
            healthy=0
            for attempt in $(seq 1 45); do
              container_state="$(docker inspect --format '{{.State.Status}}' nexcampus_be 2>/dev/null || true)"
              health_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' nexcampus_be 2>/dev/null || true)"

              if [ "${health_state}" = "healthy" ]; then
                healthy=1
                break
              fi

              if [ "${container_state}" = "exited" ] || [ "${container_state}" = "dead" ]; then
                break
              fi

              sleep 2
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "The new backend did not become healthy."
              docker-compose logs --tail=200 backend || true
              rollback_backend
              exit 1
            fi

            echo "Checking that the meetings route exists in the deployed image..."
            if ! docker exec nexcampus_be node -e "fetch('http://127.0.0.1:8888/api/v1/meetings?limit=1').then((response) => { if (response.status !== 401) { console.error('Expected meetings route to return 401 without credentials, received', response.status); process.exit(1); } }).catch((error) => { console.error(error); process.exit(1); })"; then
              docker-compose logs --tail=200 backend || true
              rollback_backend
              exit 1
            fi

            echo "Pruning unused images..."
            docker image rm "${rollback_image}" || true
            docker image prune -f

            echo "Backend image ${deploy_image} deployed successfully!"
            docker-compose ps backend
