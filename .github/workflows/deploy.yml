name: Deploy Backend to VPS (GHCR)

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push BE Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/hnihtyob/nexcampus-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/nexcampus/NexCampus-BE

            echo "Pulling compose file changes..."
            git pull origin production

            echo "Authenticating Docker with GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u hnihtyob --password-stdin

            echo "Pulling backend image from GHCR..."
            docker-compose pull backend

            echo "Stopping and removing old container..."
            docker-compose stop backend || true
            docker-compose rm -f backend || true

            echo "Re-creating backend container..."
            docker-compose up -d --no-deps backend

            echo "Pruning unused images..."
            docker image prune -f

            echo "Backend deployed successfully!"
            docker-compose ps backend
