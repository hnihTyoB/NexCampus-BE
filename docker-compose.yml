services:
  postgres:
    image: postgres:16-alpine
    container_name: nexcampus_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 118118
      POSTGRES_DB: datanexcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datanexcampus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexcampus_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hnihtyob/nexcampus-backend:latest}
    container_name: nexcampus_be
    restart: always
    ports:
      - "8888:8888"
    env_file: .env
    environment:
      # Override để dùng Docker service names thay vì localhost
      DATABASE_URL: postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
      DIRECT_URL: postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8888/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ghcr.io/tradethuong/nexcampus-frontend:latest
    container_name: nexcampus_fe
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
