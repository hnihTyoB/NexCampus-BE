services:
  postgres:
    image: postgres:16-alpine
    container_name: nexcampus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 118118
      POSTGRES_DB: datanexcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datanexcampus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexcampus_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexcampus_be
    restart: always
    ports:
      - "8888:8888"
    env_file: .env
    environment:
      # Override để dùng Docker service names thay vì localhost
      DATABASE_URL: postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
      DIRECT_URL: postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../NexCampus-FE
      dockerfile: Dockerfile
    container_name: nexcampus_fe
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
