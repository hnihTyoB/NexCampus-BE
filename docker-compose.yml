services:
  postgres:
    image: postgres:16-alpine
    container_name: nexcampus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 118118
      POSTGRES_DB: datanexcampus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datanexcampus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexcampus_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment the backend service if you want to run the App in Docker
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: nexcampus_backend
  #   restart: always
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=8888
  #     - DATABASE_URL=postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
  #     - DIRECT_URL=postgresql://postgres:118118@postgres:5432/datanexcampus?schema=public
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
